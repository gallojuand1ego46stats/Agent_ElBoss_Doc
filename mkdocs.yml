site_name: Agent_ElBoss_Doc
site_description: Documentacion del sistema multiagente de analisis estadistico (El-Boss + reportero-estadistico)
repo_url: https://github.com/gallojuand1ego46stats/Agent_ElBoss_Doc
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
nav:
  - Inicio: index.md
  - Justificacion:
      - Resumen: justificacion/README.md
      - Contraparte: justificacion/contraparte.md
      - Problema: justificacion/problema.md
      - Linea base: justificacion/linea_base.md
      - Anclaje estadistico: justificacion/anclaje_estadistico.md
      - Por que un agente: justificacion/por_que_un_agente.md
      - Alternativas: justificacion/alternativas.md
      - Alcance: justificacion/alcance.md
  - Arquitectura: arquitectura.md
  - Agentes:
      - El-Boss: agentes/El-Boss.md
      - reportero-estadistico: agentes/reportero-estadistico.md
      - Skill reportes-estadisticos: agentes/SKILL-reportes.md
      - Skills del sistema: agentes/skills.md
      - Guardrails: agentes/guardrails.md
  - Implementacion:
      - Guia de instalacion: implementacion/instalacion.md
  - Pruebas:
      - Resultados: pruebas/resultado_pruebas.md
  - Sustentacion:
      - Preguntas dificiles: sustentacion/preguntas_dificiles.md
      - Guion de demostracion: sustentacion/demo_guion.md
  - Guia de actualizacion: guia-actualizacion.md
